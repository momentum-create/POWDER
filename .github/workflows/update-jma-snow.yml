# 毎日 JMA 積雪 CSV を取得し data/jma-snow.json に保存
name: Update JMA snow cache

on:
  schedule:
    - cron: "10 14 * * *"
    - cron: "10 22 * * *"  # フェイルオーバー（runner 取得失敗時）
  workflow_dispatch:

concurrency:
  group: update-jma-snow-cache
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Fetch JMA snow and write data/jma-snow.json
        run: node scripts/fetch-jma-snow.js
        env:
          TZ: Asia/Tokyo

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma-snow.json data/jma-snow-meta.json
          if git diff --staged --quiet; then
            echo "No changes to JMA snow cache."
          else
            git commit -m "chore: update JMA snow cache [automated]"
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                echo "Push succeeded on attempt ${i}."
                exit 0
              fi
              echo "Push race detected (attempt ${i}/5), retrying..."
              sleep 5
            done
            echo "Failed to push after 5 attempts."
            exit 1
          fi

  notify-failure:
    needs: update
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `[ops] ${context.workflow} failed (${context.sha.slice(0, 7)})`;
            const body = [
              `Workflow **${context.workflow}** run failed.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Branch: ${context.ref}`,
              `- Commit: ${context.sha}`,
              ``,
              `Re-run via Actions → workflow_dispatch. See docs/OPS-WEATHER.md.`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 20,
            });
            const dup = issues.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another failure at ${new Date().toISOString()}\n\n${body}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['workflow-failure', 'ops'],
            });
