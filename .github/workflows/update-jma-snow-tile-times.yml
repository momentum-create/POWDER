# JMA snow tile times — server-published latest timeStr

name: Update JMA snow tile times

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-jma-snow-tile-times
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Probe JMA tiles and write data/jma-snow-tile-times.json
        run: node scripts/fetch-jma-snow-tile-times.js
        env:
          TZ: Asia/Tokyo

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma-snow-tile-times.json
          if git diff --staged --quiet; then
            echo "No changes to JMA snow tile times."
          else
            git commit -m "chore: update JMA snow tile times [automated]"
            git pull --rebase origin main
            git push origin main
          fi

  notify-failure:
    needs: update
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = `[ops] ${context.workflow} failed (${context.sha.slice(0, 7)})`;
            const body = [
              `Workflow **${context.workflow}** run failed.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Branch: ${context.ref}`,
              `- Commit: ${context.sha}`,
              ``,
              `Re-run via Actions → workflow_dispatch. See docs/OPS-WEATHER.md.`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 20,
            });
            const dup = issues.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another failure at ${new Date().toISOString()}\n\n${body}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['workflow-failure', 'ops'],
            });
